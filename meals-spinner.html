<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJ Hawker Food · Spinner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Outfit:wght@400;500;600;700&display=swap');

  :root{
    --bg: #fff8f0;
    --ink: #2c1810;
    --paper: #ffffff;
    --line: #e8d5c4;
    --mute: #8b6914;
    --accent: #e85d04;
    --accent-dark: #c44d00;
    --gold: #f4a261;
    --cream: #fef3e2;
    --shadow: rgba(44, 24, 16, 0.12);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 0 20px 72px;
    position: relative;
  }

  body::before,
  body::after{
    content:'';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::before{
    width: 420px; height: 420px;
    top: -120px; right: -100px;
    background: radial-gradient(circle, rgba(244,162,97,0.35) 0%, transparent 70%);
  }
  body::after{
    width: 360px; height: 360px;
    bottom: -80px; left: -80px;
    background: radial-gradient(circle, rgba(232,93,4,0.18) 0%, transparent 70%);
  }

  body > *{ position: relative; z-index: 1; }

  nav{
    width: 100vw;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    padding: 18px clamp(20px, 6vw, 60px);
    background: rgba(255, 248, 240, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    margin-bottom: 32px;
    box-sizing: border-box;
  }

  .nav-inner{
    max-width: 1100px;
    margin: 0 auto;
    display:flex;
    align-items:center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 10px;
  }

  .brand{
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: var(--ink);
    text-decoration: none;
  }
  .brand em{
    font-style: normal;
    background: linear-gradient(135deg, var(--accent) 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .nav-links{
    display:flex;
    gap: 8px;
    list-style: none;
  }

  .nav-toggle{
    display: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    cursor: pointer;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
  }
  .nav-toggle span{
    display: block;
    width: 18px;
    height: 2px;
    background: var(--ink);
    border-radius: 2px;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .nav-toggle.open span:nth-child(1){ transform: translateY(6px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2){ opacity: 0; }
  .nav-toggle.open span:nth-child(3){ transform: translateY(-6px) rotate(-45deg); }

  .nav-links a{
    display:inline-block;
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .nav-links a:hover{
    background: var(--accent);
    color: var(--paper);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .nav-links a.active{
    background: var(--cream);
    border-color: var(--gold);
    color: var(--accent-dark);
  }

  .eyebrow{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--cream);
    border: 1px solid var(--line);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .eyebrow::before{ content: '✦'; font-size: 10px; }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(32px, 8vw, 52px);
    letter-spacing: -1px;
    color: var(--ink);
    margin-bottom: 10px;
    text-align: center;
    line-height: 1.05;
  }
  h1 em{
    font-style: normal;
    background: linear-gradient(135deg, var(--accent) 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sub{
    color: var(--mute);
    font-size: 15px;
    margin-bottom: 10px;
    text-align: center;
    max-width: 360px;
    line-height: 1.5;
  }

  /* ---- Turntable ---- */
  .stage{
    position: relative;
    width: min(520px, 88vw, 46vh);
    aspect-ratio: 1/1;
    margin-bottom: 32px;
    filter: drop-shadow(0 24px 48px var(--shadow));
  }

  .pointer{
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
  }
  .pointer::before{
    content:'';
    display: block;
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 28px solid var(--accent);
  }
  .pointer::after{
    content:'';
    position: absolute;
    top: 4px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
    border: 2px solid var(--paper);
  }

  .wheel-rim{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--gold) 0%, var(--accent) 50%, var(--accent-dark) 100%);
    padding: 12px;
    box-shadow:
      0 0 0 4px var(--paper),
      0 0 0 6px var(--line),
      inset 0 2px 8px rgba(255,255,255,0.4);
  }

  .wheel{
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5);
    transition: transform 4.2s cubic-bezier(0.12, 0.72, 0.11, 1);
    will-change: transform;
  }

  /* subtle pulse while spinning */
  .wheel-rim.spinning{
    animation: rimPulse 0.9s ease-in-out infinite;
  }
  @keyframes rimPulse{
    0%, 100%{ box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px var(--line), inset 0 2px 8px rgba(255,255,255,0.4); }
    50%{ box-shadow: 0 0 0 4px var(--paper), 0 0 0 9px var(--gold), inset 0 2px 8px rgba(255,255,255,0.4); }
  }

  .wheel-label{
    position: absolute;
    top: 0; left: 50%;
    width: 50%;
    height: 50%;
    transform-origin: 0% 100%;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 11%;
    pointer-events: none;
  }

  .wheel-label span{
    display: block;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    white-space: pre-line;
    overflow-wrap: normal;
    word-break: normal;
    hyphens: none;
  }

  .hub{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 18%;
    aspect-ratio: 1/1;
    min-width: 52px;
    max-width: 90px;
    border-radius: 50%;
    background: linear-gradient(145deg, #fff 0%, var(--cream) 100%);
    box-shadow:
      0 0 0 4px var(--paper),
      0 0 0 6px var(--accent),
      0 4px 12px var(--shadow);
    z-index: 5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: clamp(20px, 4.2vw, 30px);
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .hub:hover{
    transform: translate(-50%, -50%) scale(1.08);
    box-shadow:
      0 0 0 4px var(--paper),
      0 0 0 8px var(--gold),
      0 4px 16px var(--shadow);
  }
  .hub:active{
    transform: translate(-50%, -50%) scale(0.96);
  }
  .hub:disabled{
    cursor: not-allowed;
  }

  .hint{
    margin-top: 4px;
    margin-bottom: 6px;
    font-size: 12.5px;
    color: var(--mute);
    letter-spacing: 0.5px;
  }

  .editor-toggle{
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-dark);
    background: var(--cream);
    border: 1px solid var(--line);
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    margin-bottom: 8px;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .editor-toggle:hover{
    border-color: var(--gold);
    transform: translateY(-1px);
  }
  .editor-toggle.open{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* ---- result badge, shown centered over the wheel ---- */
  .result-badge{
    position: absolute;
    top: 50%; left: 50%;
    width: min(220px, 60%);
    min-height: 90px;
    border-radius: 50%;
    background: var(--paper);
    border: 3px solid var(--accent);
    box-shadow: 0 12px 32px rgba(0,0,0,0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px 14px;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.3);
  }
  .result-badge.show{
    animation: badgePop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .result-badge.hide{
    transition: opacity 0.5s ease, transform 0.5s ease;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.85);
  }
  @keyframes badgePop{
    0%{ opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    60%{ opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    100%{ opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .result-badge span{
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(14px, 3.6vw, 17px);
    line-height: 1.3;
    color: var(--ink);
  }

  /* confetti pieces */
  .confetti-piece{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    pointer-events: none;
    opacity: 0;
    z-index: 20;
  }

  .editor{
    margin-top: 48px;
    width: min(480px, 92vw);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 22px 24px;
    box-shadow: 0 12px 40px var(--shadow);
  }
  .editor h2{
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .editor h2::before{
    content:'';
    flex: 0 0 24px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .items{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background: var(--cream);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    transition: border-color 0.15s, transform 0.15s;
  }
  .chip:hover{
    border-color: var(--gold);
    transform: translateY(-1px);
  }
  .chip button{
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--mute);
    cursor:pointer;
    font-size: 14px;
    line-height:1;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .chip button:hover{
    color: var(--accent);
    border-color: var(--accent);
    background: #fff5eb;
  }

  .add-row{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .add-row input{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .add-row input{ flex: 1 1 180px; min-width: 0; }
  .add-row input::placeholder{ color: #c4a882; }
  .add-row input:focus{
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232, 93, 4, 0.12);
  }
  .add-row button{
    background: var(--ink);
    border: none;
    color: var(--paper);
    padding: 0 20px;
    border-radius: 12px;
    font-size: 14px;
    cursor:pointer;
    font-weight: 600;
    transition: background 0.15s, transform 0.15s;
  }
  .add-row button:hover{
    background: var(--accent-dark);
    transform: translateY(-1px);
  }

  @media (max-width: 600px){
    .nav-inner{ justify-content: space-between; flex-wrap: wrap; }
    .nav-toggle{ display: flex; }
    .nav-links{
      display: none;
      width: 100%;
      order: 3;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .nav-links.open{ display: flex; }
    .nav-links a{ text-align: center; }
    .eyebrow{ font-size: 11px; padding: 5px 12px; letter-spacing: 2px; }
    .sub{ font-size: 14px; padding: 0 4px; }
    .editor{ padding: 18px 16px 20px; }
    .add-row button{ flex: 1 1 100%; padding: 12px 20px; }
  }

  @media (max-width: 380px){
    .brand{ font-size: 17px; }
    .nav-links a{ padding: 7px 12px; font-size: 13px; }
    h1{ letter-spacing: -0.5px; }
  }

  @media (prefers-reduced-motion: reduce){
    .wheel{ transition: none; }
    .result-badge.show{ animation: none !important; opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .wheel-rim.spinning{ animation: none; }
  }
</style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="brand" href="index.html">🥢 My <em>Little Tools</em></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="meals-spinner.html" class="active">Meals Spinner</a></li>
      </ul>
    </div>
  </nav>

  <div class="eyebrow">Petaling Jaya · Hawker Food</div>
  <h1>What's for <em>Dinner</em></h1>
  <div class="sub">Spin for noodles, rice, mamak, kopitiam &amp; pasar malam favourites around PJ</div>

  <div class="stage" id="stage">
    <div class="pointer"></div>
    <div class="wheel-rim" id="wheelRim">
      <div class="wheel" id="wheel"></div>
    </div>
    <button class="hub" id="hub" aria-label="Spin the wheel">🥢</button>
    <div class="result-badge" id="resultBadge"><span id="resultText"></span></div>
  </div>

  <div class="hint">Tap the center to spin</div>

  <button class="editor-toggle" id="editorToggle">✎ Edit menu</button>

  <div class="editor" id="editor" hidden>
    <h2>PJ Menu · Tap × to remove</h2>
    <div class="items" id="itemsList"></div>
    <div class="add-row">
      <input type="text" id="newItem" placeholder="Add a dish, e.g. Loh Mee" maxlength="22">
      <button id="addBtn">Add</button>
    </div>
  </div>

<script>
  const palette = [
    '#e85d04', '#f4a261', '#2a9d8f', '#e9c46a',
    '#264653', '#e76f51', '#606c38', '#bc6c25',
    '#9b2226', '#0077b6', '#8338ec', '#ff006e',
    '#fb8500', '#219ebc', '#588157', '#bc4749'
  ];

  // PJ hawker, mamak, kopitiam & pasar malam food types
  let foods = [
    'Nasi Lemak', 'Roti Canai', 'Pan Mee', 'Wantan Mee',
    'Yong Tau Foo', 'Curry Laksa', 'Economy Rice', 'Mee Goreng Mamak',
    'Popiah', 'Chee Cheong Fun', 'Char Kuey Teow', 'Rojak',
    'Hokkien Mee', 'Nasi Campur', 'Fish Ball Noodles', 'Bak Kut Teh'
  ];

  const wheel = document.getElementById('wheel');
  const wheelRim = document.getElementById('wheelRim');
  const stage = document.getElementById('stage');
  const hub = document.getElementById('hub');
  const resultBadge = document.getElementById('resultBadge');
  const resultText = document.getElementById('resultText');
  const itemsList = document.getElementById('itemsList');
  const newItemInput = document.getElementById('newItem');
  const addBtn = document.getElementById('addBtn');
  const editor = document.getElementById('editor');
  const editorToggle = document.getElementById('editorToggle');

  let currentRotation = 0;
  let spinning = false;
  let autoHideTimer = null;

  function wheelLabelStyle(n){
    const wheelPx = wheel.getBoundingClientRect().width || 360;
    const sliceDeg = 360 / n;
    const arcPx = Math.PI * wheelPx * 0.72 * (sliceDeg / 360);
    const fontSize = Math.max(7, Math.min(10, Math.floor(arcPx / 4.2)));
    const maxWidth = Math.max(28, Math.floor(arcPx * 0.92));
    return { fontSize, maxWidth, sliceDeg, arcPx };
  }

  function formatWheelText(name){
    const words = name.trim().split(/\s+/);
    if(words.length <= 2) return name;
    const mid = Math.ceil(words.length / 2);
    return words.slice(0, mid).join(' ') + '\n' + words.slice(mid).join(' ');
  }

  function renderWheel(){
    const n = foods.length;
    if(n === 0){
      wheel.style.background = '#e8d5c4';
      wheel.innerHTML = '';
      return;
    }
    const slice = 360 / n;
    const gradientParts = foods.map((_, i) => {
      const color = palette[i % palette.length];
      const start = i * slice;
      const end = start + slice;
      return `${color} ${start}deg ${end}deg`;
    });
    wheel.style.background = `conic-gradient(${gradientParts.join(', ')})`;

    wheel.innerHTML = '';
    const style = wheelLabelStyle(n);
    foods.forEach((food, i) => {
      const labelWrap = document.createElement('div');
      labelWrap.className = 'wheel-label';
      const angle = slice * i + slice / 2;
      labelWrap.style.transform = `rotate(${angle}deg)`;

      const span = document.createElement('span');
      span.textContent = formatWheelText(food);
      span.style.fontSize = style.fontSize + 'px';
      span.style.maxWidth = style.maxWidth + 'px';
      span.style.transform = `rotate(${-angle}deg)`;
      span.style.color = '#ffffff';
      span.style.textShadow = '0 1px 2px rgba(0,0,0,0.5)';
      labelWrap.appendChild(span);
      wheel.appendChild(labelWrap);
    });
  }

  function renderItemsList(){
    itemsList.innerHTML = '';
    foods.forEach((food, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      const dot = document.createElement('span');
      dot.textContent = '●';
      dot.style.color = palette[i % palette.length];
      dot.style.fontSize = '8px';
      const label = document.createElement('span');
      label.textContent = food;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '×';
      removeBtn.onclick = () => {
        foods.splice(i, 1);
        renderWheel();
        renderItemsList();
      };
      chip.appendChild(dot);
      chip.appendChild(label);
      chip.appendChild(removeBtn);
      itemsList.appendChild(chip);
    });
  }

  function addFood(){
    const val = newItemInput.value.trim();
    if(!val) return;
    if(foods.length >= 16){
      newItemInput.value = '';
      newItemInput.placeholder = 'Max 16 — remove one to add more';
      return;
    }
    foods.push(val);
    newItemInput.value = '';
    renderWheel();
    renderItemsList();
  }

  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    navToggle.classList.toggle('open', isOpen);
    navToggle.setAttribute('aria-expanded', isOpen);
  });

  editorToggle.addEventListener('click', () => {
    const isOpen = !editor.hidden;
    editor.hidden = isOpen;
    editorToggle.classList.toggle('open', !isOpen);
    editorToggle.textContent = isOpen ? '✎ Edit menu' : '✕ Close menu';
  });

  addBtn.addEventListener('click', addFood);
  newItemInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addFood();
  });

  // ---- confetti burst on result ----
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const confettiColors = ['#e85d04', '#f4a261', '#2a9d8f', '#e9c46a', '#8338ec', '#ff006e'];

  function burstConfetti(){
    if(reduceMotion) return;
    const count = 26;
    for(let i = 0; i < count; i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const color = confettiColors[i % confettiColors.length];
      const isCircle = Math.random() > 0.5;
      piece.style.background = color;
      piece.style.borderRadius = isCircle ? '50%' : '2px';
      piece.style.width = piece.style.height = (5 + Math.random() * 5) + 'px';

      const angle = Math.random() * Math.PI * 2;
      const distance = 70 + Math.random() * 90;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance - 40; // bias upward
      const rot = (Math.random() * 720 - 360) + 'deg';
      const duration = 700 + Math.random() * 500;

      stage.appendChild(piece);

      piece.animate([
        { transform: 'translate(-50%, -50%) translate(0, 0) rotate(0deg)', opacity: 1 },
        { transform: `translate(-50%, -50%) translate(${dx * 0.6}px, ${dy}px) rotate(${rot})`, opacity: 1, offset: 0.65 },
        { transform: `translate(-50%, -50%) translate(${dx}px, ${dy + 90}px) rotate(${rot})`, opacity: 0 }
      ], {
        duration,
        easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)'
      });

      setTimeout(() => piece.remove(), duration + 50);
    }
  }

  hub.addEventListener('click', () => {
    if(spinning || foods.length === 0) return;
    spinning = true;
    hub.disabled = true;
    clearTimeout(autoHideTimer);
    resultBadge.classList.remove('show', 'hide');
    wheelRim.classList.add('spinning');

    const n = foods.length;
    const slice = 360 / n;

    const winnerIndex = Math.floor(Math.random() * n);
    const sliceCenter = winnerIndex * slice + slice / 2;

    const extraSpins = 5 + Math.floor(Math.random() * 3);
    const targetMod = (360 - sliceCenter) % 360;
    const currentMod = currentRotation % 360;
    let delta = targetMod - currentMod;
    if(delta < 0) delta += 360;
    const totalRotation = currentRotation + delta + extraSpins * 360;

    currentRotation = totalRotation;
    wheel.style.transform = `rotate(${totalRotation}deg)`;

    setTimeout(() => {
      spinning = false;
      hub.disabled = false;
      wheelRim.classList.remove('spinning');
      resultText.textContent = foods[winnerIndex];
      resultBadge.classList.add('show');
      burstConfetti();

      autoHideTimer = setTimeout(() => {
        resultBadge.classList.remove('show');
        resultBadge.classList.add('hide');
      }, 3800);
    }, 4300);
  });

  renderWheel();
  renderItemsList();

  // re-measure label sizing when the viewport changes, so text stays
  // proportional to the wheel instead of freezing at the load-time size
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderWheel, 150);
  });
</script>

</body>
</html>
