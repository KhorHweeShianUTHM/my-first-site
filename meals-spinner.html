<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJ Hawker Food · Spinner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Outfit:wght@400;500;600;700&display=swap');

  :root{
    --bg: #fff8f0;
    --ink: #2c1810;
    --paper: #ffffff;
    --line: #e8d5c4;
    --mute: #8b6914;
    --accent: #e85d04;
    --accent-dark: #c44d00;
    --gold: #f4a261;
    --cream: #fef3e2;
    --shadow: rgba(44, 24, 16, 0.12);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 0 20px 72px;
    position: relative;
  }

  body::before,
  body::after{
    content:'';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::before{
    width: 420px; height: 420px;
    top: -120px; right: -100px;
    background: radial-gradient(circle, rgba(244,162,97,0.35) 0%, transparent 70%);
  }
  body::after{
    width: 360px; height: 360px;
    bottom: -80px; left: -80px;
    background: radial-gradient(circle, rgba(232,93,4,0.18) 0%, transparent 70%);
  }

  body > *{ position: relative; z-index: 1; }

  nav{
    width: 100%;
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 18px clamp(20px, 6vw, 60px);
    background: rgba(255, 248, 240, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    margin-bottom: 32px;
  }

  .brand{
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: var(--ink);
    text-decoration: none;
  }
  .brand em{
    font-style: normal;
    background: linear-gradient(135deg, var(--accent) 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .nav-links{
    display:flex;
    gap: 8px;
    list-style: none;
  }

  .nav-links a{
    display:inline-block;
    color: var(--ink);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .nav-links a:hover{
    background: var(--accent);
    color: var(--paper);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .nav-links a.active{
    background: var(--cream);
    border-color: var(--gold);
    color: var(--accent-dark);
  }

  .eyebrow{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--cream);
    border: 1px solid var(--line);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .eyebrow::before{ content: '✦'; font-size: 10px; }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(32px, 8vw, 52px);
    letter-spacing: -1px;
    color: var(--ink);
    margin-bottom: 10px;
    text-align: center;
    line-height: 1.05;
  }
  h1 em{
    font-style: normal;
    background: linear-gradient(135deg, var(--accent) 0%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sub{
    color: var(--mute);
    font-size: 15px;
    margin-bottom: 10px;
    text-align: center;
    max-width: 360px;
    line-height: 1.5;
  }

  /* ---- Turntable ---- */
  .stage{
    position: relative;
    width: min(360px, 88vw);
    aspect-ratio: 1/1;
    margin-bottom: 32px;
    filter: drop-shadow(0 24px 48px var(--shadow));
  }

  .pointer{
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
  }
  .pointer::before{
    content:'';
    display: block;
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 28px solid var(--accent);
  }
  .pointer::after{
    content:'';
    position: absolute;
    top: 4px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
    border: 2px solid var(--paper);
  }

  .wheel-rim{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--gold) 0%, var(--accent) 50%, var(--accent-dark) 100%);
    padding: 12px;
    box-shadow:
      0 0 0 4px var(--paper),
      0 0 0 6px var(--line),
      inset 0 2px 8px rgba(255,255,255,0.4);
  }

  .wheel{
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5);
    transition: transform 4.2s cubic-bezier(0.12, 0.72, 0.11, 1);
    will-change: transform;
  }

  .wheel-label{
    position: absolute;
    top: 0; left: 50%;
    width: 50%;
    height: 50%;
    transform-origin: 0% 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 16%;
    pointer-events: none;
  }

  .wheel-label span{
    display: inline-block;
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: clamp(8px, 2.2vw, 10px);
    line-height: 1.15;
    text-align: center;
    max-width: 72px;
    word-break: break-word;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  .hub{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 58px; height: 58px;
    border-radius: 50%;
    background: linear-gradient(145deg, #fff 0%, var(--cream) 100%);
    box-shadow:
      0 0 0 4px var(--paper),
      0 0 0 6px var(--accent),
      0 4px 12px var(--shadow);
    z-index: 4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 22px;
  }

  .spin-btn{
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 4px;
    color: var(--paper);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    border: none;
    padding: 16px 48px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow:
      0 4px 0 var(--accent-dark),
      0 8px 24px rgba(232, 93, 4, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .spin-btn:hover{
    transform: translateY(-2px);
    box-shadow:
      0 6px 0 var(--accent-dark),
      0 12px 28px rgba(232, 93, 4, 0.4);
  }
  .spin-btn:active{
    transform: translateY(3px);
    box-shadow:
      0 1px 0 var(--accent-dark),
      0 4px 12px rgba(232, 93, 4, 0.3);
  }
  .spin-btn:disabled{
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: 0 4px 0 var(--accent-dark);
  }

  .result{
    margin-top: 28px;
    min-height: 80px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ticket{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(17px, 4.2vw, 22px);
    padding: 16px 36px;
    border: 2px dashed var(--accent);
    border-radius: 12px;
    position: relative;
    opacity: 0;
    transform: translateY(12px) scale(0.92);
    transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 24px var(--shadow);
    text-align: center;
    line-height: 1.35;
  }
  .ticket.show{ opacity: 1; transform: translateY(0) scale(1); }
  .ticket::before, .ticket::after{
    content:'🍽';
    position:absolute;
    top:50%;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: 0.7;
  }
  .ticket::before{ left: 10px; }
  .ticket::after{ right: 10px; }

  .editor{
    margin-top: 48px;
    width: min(480px, 92vw);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 22px 24px;
    box-shadow: 0 12px 40px var(--shadow);
  }
  .editor h2{
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .editor h2::before{
    content:'';
    flex: 0 0 24px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .items{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background: var(--cream);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    transition: border-color 0.15s, transform 0.15s;
  }
  .chip:hover{
    border-color: var(--gold);
    transform: translateY(-1px);
  }
  .chip button{
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--mute);
    cursor:pointer;
    font-size: 14px;
    line-height:1;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .chip button:hover{
    color: var(--accent);
    border-color: var(--accent);
    background: #fff5eb;
  }

  .add-row{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .add-row input{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .add-row input{ flex: 1; }
  .add-row input::placeholder{ color: #c4a882; }
  .add-row input:focus{
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232, 93, 4, 0.12);
  }
  .add-row button{
    background: var(--ink);
    border: none;
    color: var(--paper);
    padding: 0 20px;
    border-radius: 12px;
    font-size: 14px;
    cursor:pointer;
    font-weight: 600;
    transition: background 0.15s, transform 0.15s;
  }
  .add-row button:hover{
    background: var(--accent-dark);
    transform: translateY(-1px);
  }

  @media (prefers-reduced-motion: reduce){
    .wheel{ transition: none; }
    .ticket{ transition: opacity 0.2s; }
  }
</style>
</head>
<body>

  <nav>
    <a class="brand" href="index.html">🥢 My <em>Little Tools</em></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="meals-spinner.html" class="active">Meals Spinner</a></li>
    </ul>
  </nav>

  <div class="eyebrow">Petaling Jaya · Hawker Food</div>
  <h1>What's for <em>Dinner</em></h1>
  <div class="sub">Spin for noodles, rice, mamak, kopitiam &amp; pasar malam favourites around PJ</div>

  <div class="stage">
    <div class="pointer"></div>
    <div class="wheel-rim">
      <div class="wheel" id="wheel"></div>
    </div>
    <div class="hub">🥢</div>
  </div>

  <button class="spin-btn" id="spinBtn">S P I N</button>

  <div class="result">
    <div class="ticket" id="ticket"></div>
  </div>

  <div class="editor">
    <h2>PJ Menu · Tap × to remove</h2>
    <div class="items" id="itemsList"></div>
    <div class="add-row">
      <input type="text" id="newItem" placeholder="Add a dish, e.g. Loh Mee" maxlength="22">
      <button id="addBtn">Add</button>
    </div>
  </div>

<script>
  const palette = [
    '#e85d04', '#f4a261', '#2a9d8f', '#e9c46a',
    '#264653', '#e76f51', '#606c38', '#bc6c25',
    '#9b2226', '#0077b6', '#8338ec', '#ff006e',
    '#fb8500', '#219ebc', '#588157', '#bc4749'
  ];

  // PJ hawker, mamak, kopitiam & pasar malam food types
  let foods = [
    'Nasi Lemak', 'Roti Canai', 'Pan Mee', 'Wantan Mee',
    'Yong Tau Foo', 'Curry Laksa', 'Economy Rice', 'Mee Goreng Mamak',
    'Popiah', 'Chee Cheong Fun', 'Char Kuey Teow', 'Rojak',
    'Hokkien Mee', 'Nasi Campur', 'Fish Ball Noodles', 'Bak Kut Teh'
  ];

  const wheel = document.getElementById('wheel');
  const spinBtn = document.getElementById('spinBtn');
  const ticket = document.getElementById('ticket');
  const itemsList = document.getElementById('itemsList');
  const newItemInput = document.getElementById('newItem');
  const addBtn = document.getElementById('addBtn');

  let currentRotation = 0;
  let spinning = false;

  function textColorForBg(hex){
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.55 ? '#2c1810' : '#ffffff';
  }

  function renderWheel(){
    const n = foods.length;
    if(n === 0){
      wheel.style.background = '#e8d5c4';
      wheel.innerHTML = '';
      return;
    }
    const slice = 360 / n;
    const gradientParts = foods.map((_, i) => {
      const color = palette[i % palette.length];
      const start = i * slice;
      const end = start + slice;
      return `${color} ${start}deg ${end}deg`;
    });
    wheel.style.background = `conic-gradient(${gradientParts.join(', ')})`;

    wheel.innerHTML = '';
    foods.forEach((food, i) => {
      const labelWrap = document.createElement('div');
      labelWrap.className = 'wheel-label';
      const angle = slice * i + slice / 2;
      labelWrap.style.transform = `rotate(${angle}deg)`;

      const span = document.createElement('span');
      span.textContent = food;
      span.style.transform = `rotate(${-angle}deg)`;
      span.style.color = textColorForBg(palette[i % palette.length]);
      labelWrap.appendChild(span);
      wheel.appendChild(labelWrap);
    });
  }

  function renderItemsList(){
    itemsList.innerHTML = '';
    foods.forEach((food, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      const dot = document.createElement('span');
      dot.textContent = '●';
      dot.style.color = palette[i % palette.length];
      dot.style.fontSize = '8px';
      const label = document.createElement('span');
      label.textContent = food;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '×';
      removeBtn.onclick = () => {
        foods.splice(i, 1);
        renderWheel();
        renderItemsList();
      };
      chip.appendChild(dot);
      chip.appendChild(label);
      chip.appendChild(removeBtn);
      itemsList.appendChild(chip);
    });
  }

  function addFood(){
    const val = newItemInput.value.trim();
    if(!val) return;
    if(foods.length >= 16){
      newItemInput.value = '';
      newItemInput.placeholder = 'Max 16 — remove one to add more';
      return;
    }
    foods.push(val);
    newItemInput.value = '';
    renderWheel();
    renderItemsList();
  }

  addBtn.addEventListener('click', addFood);
  newItemInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addFood();
  });

  spinBtn.addEventListener('click', () => {
    if(spinning || foods.length === 0) return;
    spinning = true;
    spinBtn.disabled = true;
    ticket.classList.remove('show');

    const n = foods.length;
    const slice = 360 / n;

    const winnerIndex = Math.floor(Math.random() * n);
    const sliceCenter = winnerIndex * slice + slice / 2;

    const extraSpins = 5 + Math.floor(Math.random() * 3);
    const targetMod = (360 - sliceCenter) % 360;
    const currentMod = currentRotation % 360;
    let delta = targetMod - currentMod;
    if(delta < 0) delta += 360;
    const totalRotation = currentRotation + delta + extraSpins * 360;

    currentRotation = totalRotation;
    wheel.style.transform = `rotate(${totalRotation}deg)`;

    setTimeout(() => {
      spinning = false;
      spinBtn.disabled = false;
      ticket.textContent = `It's ${foods[winnerIndex]} tonight!`;
      ticket.classList.add('show');
    }, 4300);
  });

  renderWheel();
  renderItemsList();
</script>

</body>
</html>
