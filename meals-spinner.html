<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's for Dinner · Spinner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #ffffff;
    --ink: #111111;
    --paper: #f4f4f4;
    --line: #d9d9d9;
    --mute: #6b6b6b;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 20px 60px;
    position: relative;
  }

  .eyebrow{
    font-family: 'Inter', sans-serif;
    color: var(--mute);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(32px, 8vw, 50px);
    letter-spacing: -1px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .sub{
    color: var(--mute);
    font-size: 14px;
    margin-bottom: 36px;
  }

  /* ---- Turntable ---- */
  .stage{
    position: relative;
    width: min(340px, 82vw);
    aspect-ratio: 1/1;
    margin-bottom: 28px;
  }

  .pointer{
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 24px solid var(--ink);
    z-index: 5;
  }

  .wheel-rim{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--ink);
    padding: 10px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.18);
  }

  .wheel{
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: inset 0 0 0 2px var(--ink);
    transition: transform 4.2s cubic-bezier(0.12, 0.72, 0.11, 1);
    will-change: transform;
  }

  .wheel-label{
    position: absolute;
    top: 0; left: 50%;
    width: 50%;
    height: 50%;
    transform-origin: 0% 100%;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 14%;
    pointer-events: none;
  }

  .wheel-label span{
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
    max-width: 96px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hub{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--bg);
    box-shadow: 0 0 0 3px var(--ink);
    z-index: 4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 18px;
  }

  .spin-btn{
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--bg);
    background: var(--ink);
    border: 2px solid var(--ink);
    padding: 14px 40px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .spin-btn:hover{ transform: translateY(-2px); }
  .spin-btn:active{ transform: translateY(1px) scale(0.98); }
  .spin-btn:disabled{ opacity: 0.4; cursor: not-allowed; transform:none; }

  /* result ticket */
  .result{
    margin-top: 22px;
    min-height: 64px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ticket{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 22px;
    padding: 14px 28px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    position: relative;
    opacity: 0;
    transform: translateY(8px) scale(0.95);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .ticket.show{ opacity: 1; transform: translateY(0) scale(1); }
  .ticket::before, .ticket::after{
    content:'';
    position:absolute;
    top:50%; transform: translateY(-50%);
    width: 14px; height: 14px;
    background: var(--bg);
    border: 2px solid var(--ink);
    border-radius: 50%;
  }
  .ticket::before{ left: -9px; }
  .ticket::after{ right: -9px; }

  /* editable list */
  .editor{
    margin-top: 40px;
    width: min(420px, 90vw);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px 20px;
  }
  .editor h2{
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    font-weight: 700;
  }
  .items{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 6px 8px 6px 12px;
    border-radius: 999px;
    font-size: 13px;
  }
  .chip button{
    background:none; border:none; color:var(--mute);
    cursor:pointer; font-size: 15px; line-height:1;
    padding: 2px 4px;
  }
  .chip button:hover{ color: var(--ink); }

  .add-row{
    display:flex;
    gap: 8px;
  }
  .add-row input{
    flex:1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }
  .add-row input::placeholder{ color: #a3a3a3; }
  .add-row input:focus{ outline: none; border-color: var(--ink); }
  .add-row button{
    background: var(--ink);
    border: none;
    color: var(--bg);
    padding: 0 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor:pointer;
    font-weight: 500;
  }
  .add-row button:hover{ opacity: 0.85; }

  @media (prefers-reduced-motion: reduce){
    .wheel{ transition: none; }
    .ticket{ transition: opacity 0.2s; }
  }
</style>
</head>
<body>

  <div class="eyebrow">End Your Indecision</div>
  <h1>What's for Dinner</h1>
  <div class="sub">Give the wheel a spin, let fate decide</div>

  <div class="stage">
    <div class="pointer"></div>
    <div class="wheel-rim">
      <div class="wheel" id="wheel"></div>
    </div>
    <div class="hub">🥢</div>
  </div>

  <button class="spin-btn" id="spinBtn">S P I N</button>

  <div class="result">
    <div class="ticket" id="ticket"></div>
  </div>

  <div class="editor">
    <h2>Menu · Tap × to remove</h2>
    <div class="items" id="itemsList"></div>
    <div class="add-row">
      <input type="text" id="newItem" placeholder="Add a dish, e.g. Loh Mee" maxlength="20">
      <button id="addBtn">Add</button>
    </div>
  </div>

<script>
  // alternating black / white slices for a minimal look
  const palette = ['#111111', '#ffffff'];

  let foods = ['Char Kway Teow', 'Hokkien Mee', 'Bak Kut Teh', 'Wantan Mee', 'Hainanese Chicken Rice', 'Claypot Rice', 'Yong Tau Foo', 'Fish Head Noodles'];

  const wheel = document.getElementById('wheel');
  const spinBtn = document.getElementById('spinBtn');
  const ticket = document.getElementById('ticket');
  const itemsList = document.getElementById('itemsList');
  const newItemInput = document.getElementById('newItem');
  const addBtn = document.getElementById('addBtn');

  let currentRotation = 0;
  let spinning = false;

  function renderWheel(){
    const n = foods.length;
    if(n === 0){
      wheel.style.background = '#e5e5e5';
      wheel.innerHTML = '';
      return;
    }
    const slice = 360 / n;
    const gradientParts = foods.map((_, i) => {
      const color = palette[i % palette.length];
      const start = i * slice;
      const end = start + slice;
      return `${color} ${start}deg ${end}deg`;
    });
    wheel.style.background = `conic-gradient(${gradientParts.join(', ')})`;

    wheel.innerHTML = '';
    foods.forEach((food, i) => {
      const labelWrap = document.createElement('div');
      labelWrap.className = 'wheel-label';
      const angle = slice * i + slice / 2;
      labelWrap.style.transform = `rotate(${angle}deg)`;
      const span = document.createElement('span');
      span.textContent = food;
      // contrast: dark slice -> white text, light slice -> black text
      const sliceColor = palette[i % palette.length];
      span.style.color = sliceColor === '#111111' ? '#ffffff' : '#111111';
      labelWrap.appendChild(span);
      wheel.appendChild(labelWrap);
    });
  }

  function renderItemsList(){
    itemsList.innerHTML = '';
    foods.forEach((food, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = food;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '×';
      removeBtn.onclick = () => {
        foods.splice(i, 1);
        renderWheel();
        renderItemsList();
      };
      chip.appendChild(label);
      chip.appendChild(removeBtn);
      itemsList.appendChild(chip);
    });
  }

  function addFood(){
    const val = newItemInput.value.trim();
    if(!val) return;
    if(foods.length >= 16){
      newItemInput.value = '';
      newItemInput.placeholder = 'Max 16 — remove one to add more';
      return;
    }
    foods.push(val);
    newItemInput.value = '';
    renderWheel();
    renderItemsList();
  }

  addBtn.addEventListener('click', addFood);
  newItemInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addFood();
  });

  spinBtn.addEventListener('click', () => {
    if(spinning || foods.length === 0) return;
    spinning = true;
    spinBtn.disabled = true;
    ticket.classList.remove('show');

    const n = foods.length;
    const slice = 360 / n;

    const winnerIndex = Math.floor(Math.random() * n);
    const sliceCenter = winnerIndex * slice + slice / 2;

    const extraSpins = 5 + Math.floor(Math.random() * 3); // 5-7 full spins
    const targetMod = (360 - sliceCenter) % 360;
    const currentMod = currentRotation % 360;
    let delta = targetMod - currentMod;
    if(delta < 0) delta += 360;
    const totalRotation = currentRotation + delta + extraSpins * 360;

    currentRotation = totalRotation;
    wheel.style.transform = `rotate(${totalRotation}deg)`;

    setTimeout(() => {
      spinning = false;
      spinBtn.disabled = false;
      ticket.textContent = `It's ${foods[winnerIndex]} tonight`;
      ticket.classList.add('show');
    }, 4300);
  });

  renderWheel();
  renderItemsList();
</script>

</body>
</html>
